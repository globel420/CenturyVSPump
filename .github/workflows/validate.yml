name: Validate firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests-and-firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        esphome: ["2026.9.0", "2026.9.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Test schedules, physical button logic, and autonomous controller
        run: tests/run_host_tests.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ESPHome
        run: python -m pip install esphome==${{ matrix.esphome }}

      - name: Validate and compile the reference firmware
        run: |
          cp secrets.example.yaml secrets.yaml
          esphome config vgreen_evo_atom.yaml >/dev/null
          esphome compile vgreen_evo_atom.yaml

      - name: Checksum reference-only images
        working-directory: .esphome/build/vgreen-evo-controller/build
        run: sha256sum firmware.ota.bin firmware.factory.bin > SHA256SUMS

      - name: Preserve reference builds (example credentials only)
        uses: actions/upload-artifact@v4
        with:
          name: reference-only-esphome-${{ matrix.esphome }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .esphome/build/vgreen-evo-controller/build/firmware.ota.bin
            .esphome/build/vgreen-evo-controller/build/firmware.factory.bin
            .esphome/build/vgreen-evo-controller/build/SHA256SUMS
