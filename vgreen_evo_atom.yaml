substitutions:
  device_name: vgreen-evo-controller
  friendly_name: VGreen EVO Controller

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.1
  comment: Offline stock-style controller for VGreen EVO EVC165
  project:
    name: globel420.vgreen_evo_offline
    version: 0.2.0-rc1
  on_boot:
    priority: -200
    then:
      - lambda: |-
          id(evo_controller).set_schedule_set(id(saved_schedule_set_b) ? 1 : 0);
          id(evo_controller).set_schedule_profile(id(saved_schedule_profile));
          id(evo_controller).set_freeze_enabled(id(saved_freeze_enabled));
          // Power restoration always starts the selected schedule at Hour 1.
          id(evo_controller).set_paused(false);
          id(evo_controller).restart_schedule();
          id(evo_controller).set_profile_save_callback([](uint8_t profile) {
            id(saved_schedule_profile) = profile;
            id(schedule_profile).publish_state(std::to_string(profile));
          });

preferences:
  flash_write_interval: 1s

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  level: INFO

debug:
  update_interval: 60s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none
  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_ap_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: set_schedule_phase
      variables:
        seconds: int
      then:
        - lambda: |-
            id(evo_controller).set_schedule_phase(seconds);

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - lambda: |-
            id(evo_controller).set_paused(true);

web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

external_components:
  - source:
      type: local
      path: components
    components:
      - centuryvspump
      - vgreen_evo_controller

uart:
  id: pump_uart
  baud_rate: 9600
  rx_pin: GPIO22
  tx_pin: GPIO19

modbus:
  id: pump_modbus
  send_wait_time: 200ms
  turnaround_time: 50ms

centuryvspump:
  id: pump
  modbus_id: pump_modbus
  address: 0x15
  update_interval: 5s

number:
  - platform: centuryvspump
    id: pump_demand
    name: Internal Pump Demand
    century_vs_pump_id: pump
    internal: true

switch:
  - platform: centuryvspump
    id: pump_run
    name: Internal Pump Run
    century_vs_pump_id: pump
    internal: true

  - platform: template
    id: maintenance_pause
    name: Maintenance Pause
    icon: mdi:pause-circle
    lambda: |-
      return id(evo_controller).is_paused();
    turn_on_action:
      - lambda: |-
          id(evo_controller).set_paused(true);
    turn_off_action:
      - lambda: |-
          id(evo_controller).resume_schedule();

  - platform: template
    id: freeze_protection_enabled
    name: Experimental Local Freeze Protection
    icon: mdi:snowflake-thermometer
    lambda: |-
      return id(saved_freeze_enabled);
    turn_on_action:
      - lambda: |-
          id(saved_freeze_enabled) = true;
          id(evo_controller).set_freeze_enabled(true);
    turn_off_action:
      - lambda: |-
          id(saved_freeze_enabled) = false;
          id(evo_controller).set_freeze_enabled(false);

sensor:
  - platform: centuryvspump
    id: pump_actual_rpm
    name: Actual Pump Speed
    century_vs_pump_id: pump
    type: rpm
    unit_of_measurement: RPM
    accuracy_decimals: 0

  - platform: centuryvspump
    id: pump_reported_demand
    name: Reported Pump Demand
    century_vs_pump_id: pump
    type: custom
    page: 0
    address: 3
    scale: 4
    unit_of_measurement: RPM
    accuracy_decimals: 0

  - platform: centuryvspump
    id: pump_ambient
    name: Experimental Motor Ambient Temperature
    century_vs_pump_id: pump
    type: custom
    page: 0
    address: 7
    scale: 128
    signed: true
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true

  - platform: template
    name: Controller Target Speed
    unit_of_measurement: RPM
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(evo_controller).get_target_rpm();

  - platform: template
    name: Schedule Hour
    unit_of_measurement: h
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(evo_controller).get_schedule_hour();

  - platform: template
    name: Schedule Position Seconds
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return id(evo_controller).get_schedule_elapsed_seconds();

  - platform: uptime
    name: Controller Uptime
    entity_category: diagnostic

  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
    disabled_by_default: true

binary_sensor:
  - platform: template
    name: Pump Communication Healthy
    device_class: connectivity
    lambda: |-
      return id(evo_controller).is_communication_healthy();

  - platform: template
    name: Freeze Temperature Available
    device_class: connectivity
    lambda: |-
      return id(evo_controller).is_freeze_available();

  - platform: template
    name: Motor Fault Latched
    device_class: problem
    lambda: |-
      return id(evo_controller).is_motor_fault_active();

  - platform: template
    id: atom_button
    name: Controller Button
    entity_category: diagnostic
    lambda: |-
      return id(evo_controller).is_button_pressed();

vgreen_evo_controller:
  id: evo_controller
  centuryvspump_id: pump
  run_switch_id: pump_run
  demand_number_id: pump_demand
  ambient_temperature_id: pump_ambient
  button_pin:
    number: GPIO39
    inverted: true

select:
  - platform: template
    id: schedule_set
    name: Stock Schedule Set
    icon: mdi:calendar-clock
    options:
      - A
      - B
    lambda: |-
      return id(evo_controller).get_schedule_set() == vgreen_evo::stock::ScheduleSet::B ? "B" : "A";
    update_interval: 1s
    set_action:
      - lambda: |-
          id(saved_schedule_set_b) = (x == "B");
          id(evo_controller).set_schedule_set(x == "B" ? 1 : 0);

  - platform: template
    id: schedule_profile
    name: Stock Schedule Profile
    icon: mdi:numeric
    options:
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
    lambda: |-
      return std::to_string(id(evo_controller).get_schedule_profile());
    update_interval: 1s
    set_action:
      - lambda: |-
          const uint8_t profile = static_cast<uint8_t>(atoi(x.c_str()));
          id(saved_schedule_profile) = profile;
          id(evo_controller).set_schedule_profile(profile);

button:
  - platform: template
    name: Start 24-Hour Override
    icon: mdi:speedometer
    on_press:
      - lambda: |-
          id(evo_controller).start_override();

  - platform: template
    name: Resume Current Schedule
    icon: mdi:play-circle
    on_press:
      - lambda: |-
          id(evo_controller).resume_schedule();

  - platform: template
    name: Restart Schedule at Hour One
    icon: mdi:restart
    on_press:
      - lambda: |-
          id(evo_controller).restart_schedule();

text_sensor:
  - platform: debug
    reset_reason:
      name: Controller Reset Reason
      entity_category: diagnostic

  - platform: template
    name: Last Controller Button Action
    entity_category: diagnostic
    update_interval: 250ms
    lambda: |-
      return id(evo_controller).get_last_button_action();

  - platform: template
    name: Controller Mode
    update_interval: 1s
    lambda: |-
      return id(evo_controller).get_mode_name();

light:
  - platform: esp32_rmt_led_strip
    id: atom_led
    name: Controller Status LED
    internal: true
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

interval:
  - interval: 25ms
    then:
      - lambda: |-
          const uint32_t rgb = id(evo_controller).get_indicator_rgb();
          static uint32_t previous = UINT32_MAX;
          if (rgb == previous) return;
          previous = rgb;
          auto call = rgb == 0 ? id(atom_led).turn_off() : id(atom_led).turn_on();
          call.set_brightness(0.20f);
          call.set_rgb(((rgb >> 16) & 255) / 255.0f,
                       ((rgb >> 8) & 255) / 255.0f, (rgb & 255) / 255.0f);
          call.perform();

globals:
  - id: saved_schedule_set_b
    type: bool
    restore_value: true
    initial_value: "false"

  - id: saved_schedule_profile
    type: uint8_t
    restore_value: true
    initial_value: "1"

  - id: saved_freeze_enabled
    type: bool
    restore_value: true
    initial_value: "false"
